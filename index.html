<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover enables env(safe-area-inset-*) for the buy bar and drawer. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="dwb — des pièces de seconde main, choisies avec soin." />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Start the Supabase TLS handshake while the JS bundle downloads. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Readex Pro, self-hosted (public/fonts, @font-face in index.css): one
         variable file per script, 54 KB together. Preloaded because every
         page mixes both scripts (Arabic UI, Latin prices and names). -->
    <link rel="preload" href="/fonts/readex-pro-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/readex-pro-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>dwb</title>
  </head>

    <div id="root"></div>

  </body>
